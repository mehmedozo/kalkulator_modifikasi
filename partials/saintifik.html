<div id="tab-saintifik" class="isi-tab">
    <div class="grup-input">
        <input type="text" id="layar-saintifik" placeholder="0">
    </div>
    <div class="papan-tombol">
        <button class="tombol fungsi" data-nilai="sin(">sin</button>
        <button class="tombol fungsi" data-nilai="cos(">cos</button>
        <button class="tombol fungsi" data-nilai="tan(">tan</button>
        <button class="tombol aksi" data-aksi="hapus-semua">C</button>
        <button class="tombol aksi" data-aksi="hapus-satu">DEL</button>

        <button class="tombol fungsi" data-nilai="log(">log</button>
        <button class="tombol fungsi" data-nilai="ln(">ln</button>
        <button class="tombol fungsi" data-nilai="√(">√</button>
        <button class="tombol operator" data-nilai="^">^</button>
        <button class="tombol operator" data-nilai="÷">÷</button>

        <button class="tombol angka" data-nilai="7">7</button>
        <button class="tombol angka" data-nilai="8">8</button>
        <button class="tombol angka" data-nilai="9">9</button>
        <button class="tombol operator" data-nilai="(">(</button>
        <button class="tombol operator" data-nilai=")">)</button>

        <button class="tombol angka" data-nilai="4">4</button>
        <button class="tombol angka" data-nilai="5">5</button>
        <button class="tombol angka" data-nilai="6">6</button>
        <button class="tombol operator" data-nilai="×">×</button>
        <button class="tombol fungsi" data-nilai="π">π</button>

        <button class="tombol angka" data-nilai="1">1</button>
        <button class="tombol angka" data-nilai="2">2</button>
        <button class="tombol angka" data-nilai="3">3</button>
        <button class="tombol operator" data-nilai="-">-</button>
        <button class="tombol fungsi" data-nilai="e">e</button>

        <button class="tombol angka" data-nilai="0" style="grid-column: span 2;">0</button>
        <button class="tombol angka" data-nilai=".">.</button>
        <button class="tombol sama" data-aksi="hitung" style="grid-column: span 2;">=</button>
        <button class="tombol operator" data-nilai="+">+</button>
    </div>
</div>
